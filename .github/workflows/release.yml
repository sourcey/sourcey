name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/sourcey-godoc/go.mod
          cache: false

      - id: version
        name: Verify package version matches tag
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const pkg = require("./package.json");
            const expected = process.argv[1];
            if (pkg.version !== expected) {
              console.error(`package.json version ${pkg.version} does not match tag ${expected}`);
              process.exit(1);
            }
          ' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run godoc:go:test
      - run: npm run godoc:go:vet
      - run: npm run godoc:packages:test

      - name: Pack npm artifact
        run: |
          mkdir -p .stage/release
          npm pack --pack-destination .stage/release

      - uses: actions/upload-artifact@v7
        with:
          name: sourcey-npm-package
          path: .stage/release/sourcey-*.tgz

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sourcey-npm-package
          path: .stage/release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: .stage/release/sourcey-*.tgz

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: sourcey-npm-package
          path: .stage/release

      - name: Publish to npm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          if npm view "sourcey@${VERSION}" version >/dev/null 2>&1; then
            echo "sourcey@${VERSION} already exists on npm; skipping publish"
            exit 0
          fi
          npm publish ".stage/release/sourcey-${VERSION}.tgz" --provenance --access public

  # npm acknowledges a publish before the version is installable. The image and
  # the Homebrew formula both install the release from npm.
  npm-available:
    needs: [validate, publish-npm]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Wait for the npm release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          for _ in $(seq 1 60); do
            if npm view "sourcey@${VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "sourcey@${VERSION} was not installable from npm after 10 minutes" >&2
          exit 1

  publish-docker:
    needs: [validate, npm-available]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Docker Hub credentials
        id: gate
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Docker publish: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not configured."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.publish == 'true'

      - uses: docker/login-action@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.gate.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: sourcey/sourcey
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            SOURCEY_VERSION=${{ needs.validate.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-homebrew:
    needs: [validate, npm-available]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          repository: sourcey/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - uses: actions/download-artifact@v8
        with:
          name: sourcey-npm-package
          path: .stage/release

      # npm serves the published tarball byte for byte, so the validated
      # package's digest is the formula's checksum.
      - name: Point the formula at the release
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          url="https://registry.npmjs.org/sourcey/-/sourcey-${VERSION}.tgz"
          sha256=$(sha256sum "../.stage/release/sourcey-${VERSION}.tgz" | cut -d' ' -f1)
          sed -i -E "s|^  url \".*\"$|  url \"${url}\"|; s|^  sha256 \".*\"$|  sha256 \"${sha256}\"|" Formula/sourcey.rb
          grep -qF "url \"${url}\"" Formula/sourcey.rb
          grep -qF "sha256 \"${sha256}\"" Formula/sourcey.rb
          if git diff --quiet; then
            echo "The formula already installs sourcey ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sourcey ${VERSION}"
          git push
